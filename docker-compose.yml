services:
  postgres:
    image: postgres:17
    container_name: booksonthetable_postgres
    restart: unless-stopped

    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}

    ports:
      - "${DATABASE_PORT}:5432"

    volumes:
     - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
